<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Notifications - Student Information Portal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/teacher-dashboard.css">
</head>
<body class="teacher-layout">

  <!-- Mobile Sidebar Backdrop -->
  <div id="sidebarBackdrop" class="sidebar-backdrop hidden"></div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- FIXED LEFT SIDEBAR -->
  <aside id="teacherSidebar" class="teacher-sidebar" aria-label="Faculty Navigation"></aside>

  <!-- MAIN WRAPPER -->
  <div class="teacher-main-wrapper" style="margin-left: 260px; min-height: 100vh; display: flex; flex-direction: column;">
    <!-- STICKY TOP HEADER -->
    <header class="teacher-header" id="teacherHeader">
      <div class="header-left">
        <button type="button" id="toggleSidebarBtn" class="sidebar-toggle-btn" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="header-heading-group">
          <h1 class="header-title">Notifications Center</h1>
          <p class="header-subtitle">Faculty alerts, administrative notices, and student academic queries</p>
        </div>
      </div>
      <div class="header-right">
        <button type="button" id="headerNotificationBtn" class="header-notify-btn" title="View notifications" aria-label="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span id="headerNotificationDot" class="header-notify-badge hidden"></span>
        </button>
        <div class="profile-dropdown-wrapper" id="profileDropdownWrapper">
          <button type="button" id="profileDropdownBtn" class="header-profile-btn" aria-haspopup="true" aria-expanded="false" aria-label="User profile menu">
            <div class="header-avatar" id="headerUserAvatar" style="background: linear-gradient(135deg, #0d9488, #059669);">T</div>
            <div class="header-profile-meta">
              <span class="header-profile-name" id="navUserName">Faculty Member</span>
              <span class="header-profile-badge" id="userRoleBadge" style="background: #ccfbf1; color: #0f766e;">TEACHER</span>
            </div>
            <svg class="dropdown-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="dashboard-main" style="padding: 24px; flex: 1;">

      <!-- KPI Summary Cards -->
      <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
        <div class="card" style="padding: 16px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px;">
          <div style="font-size: 13px; color: #64748b; margin-bottom: 4px;">Unread Alerts</div>
          <div style="font-size: 24px; font-weight: 700; color: #0f172a;" id="kpiUnreadCount">0</div>
        </div>
        <div class="card" style="padding: 16px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px;">
          <div style="font-size: 13px; color: #64748b; margin-bottom: 4px;">Total Notifications</div>
          <div style="font-size: 24px; font-weight: 700; color: #0f172a;" id="kpiTotalCount">0</div>
        </div>
      </section>

      <!-- Toolbar -->
      <div class="card mb-4" style="padding: 12px 16px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
          <div style="display: flex; gap: 8px;">
            <button type="button" class="btn btn-primary btn-sm notif-filter-btn active" id="btnFilterAll" style="background: #0d9488; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;">All Notifications</button>
            <button type="button" class="btn btn-secondary btn-sm notif-filter-btn" id="btnFilterUnread" style="background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;">Unread Only</button>
          </div>
          <div style="display: flex; gap: 8px;">
            <button type="button" class="btn btn-secondary btn-sm" id="btnRefreshNotifs" style="background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;">
              Refresh
            </button>
            <button type="button" class="btn btn-secondary btn-sm" id="btnMarkAllRead" style="background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;">
              Mark All as Read
            </button>
          </div>
        </div>
      </div>

      <!-- Notifications List Container -->
      <div id="notificationsList" style="display: flex; flex-direction: column; gap: 12px;">
        <div class="card" style="padding: 48px 24px; text-align: center; background: #ffffff; border: 1px dashed #cbd5e1; border-radius: 8px;">
          <div style="width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; background: #ccfbf1; display: flex; align-items: center; justify-content: center; color: #0d9488;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
          </div>
          <h3 style="font-size: 18px; font-weight: 700; margin: 0 0 8px 0; color: #0f172a;">No Notifications</h3>
          <p style="color: #64748b; max-width: 480px; margin: 0 auto; font-size: 14px;">You have no new alerts, student queries, or messages at this time.</p>
        </div>
      </div>

    </main>
  </div>

  <!-- CORE SCRIPTS -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/teacher-shell.js"></script>
  <script src="/js/user-menu.js"></script>
  <script src="/js/teacher-notifications.js"></script>
</body>
</html>
